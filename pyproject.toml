[project]
name = "qfn-decision"
version = "0.1.0"
description = "Typed decisions from request-aligned Qwen3.8-Flash-Next engine logits"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
qfn-gateway = "qfn_decision.hybrid:main"
qfn-config = "qfn_decision.configure:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qfn_decision"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/storage"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
